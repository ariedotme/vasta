<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vasta</title>
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vasta" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // An old copy of this page (from a cache) names assets a new version no longer has, and would
      // stay blank: reload it once from the network. main.ts clears the mark once the app runs.
      addEventListener('error', (event) => {
        const el = event.target
        const url = (el && (el.src || el.href)) || ''
        if (!url.includes('/assets/')) return
        try {
          if (sessionStorage.getItem('vasta-reloaded')) return
          sessionStorage.setItem('vasta-reloaded', '1')
        } catch {
          return
        }
        location.reload()
      }, true)
    </script>
  </head>
  <body>
    <!-- iOS 27 blurs the top of an installed web app; a painted strip there keeps it away (style.css). -->
    <div class="ios-blur-guard" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
