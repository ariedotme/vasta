<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vasta reminder</title>
    <!-- The takeover's other screens (src-tauri/src/takeover.rs): dimmed, pointing at the reminder. -->
    <style>
      :root { color-scheme: light dark; --bg: #f7f6f3; --ink: #5f5c57; }
      @media (prefers-color-scheme: dark) { :root { --bg: #16181b; --ink: #b1ada6; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; cursor: default; user-select: none; }
      p { display: flex; align-items: center; gap: 10px; margin: 0; opacity: 0.8; }
      img { width: 22px; height: 22px; }
    </style>
  </head>
  <body>
    <p><img src="icon.svg" alt="" /> A reminder is waiting on your other screen.</p>
  </body>
</html>
