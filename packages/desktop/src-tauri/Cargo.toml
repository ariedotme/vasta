[package]
name = "vasta-desktop"
version = "0.3.1"
description = "Vasta for the desktop"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-updater = "=2.13.1"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
url = "2"
getrandom = "=0.3.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
